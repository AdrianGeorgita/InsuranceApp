services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    hostname: mssql
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./init:/init:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - "-C"
      - "-l"
      - "30"
      - "-S"
      - "mssql"
      - "-U"
      - "sa"
      - "-P"
      - "${MSSQL_SA_PASSWORD}"
      - "-v"
      - "APP_DB_NAME=${APP_DB_NAME}"
      - "-v"
      - "APP_DB_USER=${APP_DB_USER}"
      - "-v"
      - "APP_DB_PASSWORD=${APP_DB_PASSWORD}"
      - "-i"
      - "/init/00-init.sql"
    restart: "no"

  seq:
    image: datalust/seq:latest
    container_name: seq
    hostname: seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD}
    ports:
        - "5341:80"
    volumes:
        - seq_data:/data

volumes:
  mssql_data:
  seq_data:
